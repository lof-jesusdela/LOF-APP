# Copia de seguridad semanal de la base de datos de Supabase (gratis, con GitHub Actions).
# Cada lunes a las 4:00 (hora de Madrid) vuelca la base de datos, la CIFRA con tu clave y la guarda 90 días
# en Actions → «Copia semanal Supabase» → la ejecución → Artifacts. Sin la clave nadie puede abrirla.
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     → Supabase → Connect → «Session pooler» (URI con tu contraseña de la base de datos)
#   BACKUP_PASSPHRASE   → la clave para cifrar (guárdala en tu gestor de contraseñas: sin ella no se puede restaurar)
# No incluye las fotos (Storage): solo los datos.
name: Copia semanal Supabase
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - name: Volcar y cifrar
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLAVE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          F=lof-$(date -u +%Y-%m-%d)
          docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -Fc' > "$F-public.dump"
          docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump "$DB_URL" --data-only --table=auth.users --table=auth.identities -Fc' > "$F-usuarios.dump" || echo "Sin copia de auth (no imprescindible)"
          tar czf "$F.tgz" "$F"-*.dump
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase "$CLAVE" -o "$F.tgz.gpg" "$F.tgz"
          rm -f "$F"-*.dump "$F.tgz"
          ls -lh "$F.tgz.gpg"
      - name: Guardar 90 días
        uses: actions/upload-artifact@v4
        with:
          name: copia-${{ github.run_id }}
          path: lof-*.tgz.gpg
          retention-days: 90
